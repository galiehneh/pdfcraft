<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PdfCraft</title>
    <link data-trunk rel="rust" data-wasm-opt="z" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #f1f1f3; touch-action: none; }
      canvas { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
      @media (prefers-color-scheme: dark) { html, body { background: #19191c; } }
    </style>
    <script>
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
      }, false);
    </script>
  </head>
  <body>
    <canvas id="pdfcraft"></canvas>
  </body>
</html>
